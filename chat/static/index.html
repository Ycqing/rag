<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星辰科技 · 智能助手</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
       font-size: 14px; background: #f7f7f5; color: #1a1a1a; height: 100vh;
       display: flex; flex-direction: column; }

/* 登录页 */
#login-page { flex:1; display:flex; align-items:center; justify-content:center; }
.login-card { background:#fff; border:1px solid #e8e8e4; border-radius:14px;
              padding:40px 36px; width:360px; }
.login-logo { text-align:center; margin-bottom:28px; }
.login-logo-icon { width:52px; height:52px; background:#eff6ff; border-radius:14px;
                   display:flex; align-items:center; justify-content:center;
                   font-size:26px; margin:0 auto 12px; }
.login-logo h1 { font-size:17px; font-weight:500; }
.login-logo p  { font-size:13px; color:#888; margin-top:4px; }
.form-group { margin-bottom:14px; }
.form-label { display:block; font-size:13px; color:#555; margin-bottom:5px; font-weight:500; }
.form-input { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:8px;
              font-size:14px; outline:none; transition:border .15s; background:#fafaf8; }
.form-input:focus { border-color:#1d4ed8; background:#fff; }
.btn-login { width:100%; padding:10px; background:#1d4ed8; color:#fff; border:none;
             border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; margin-top:4px; }
.btn-login:hover { background:#1e40af; }
.login-hint  { font-size:12px; color:#aaa; text-align:center; margin-top:14px; }
.login-error { font-size:13px; color:#dc2626; margin-top:8px; text-align:center; }

/* 主界面 */
#chat-page { flex:1; display:none; flex-direction:column; height:100vh; }

.topbar { display:flex; align-items:center; justify-content:space-between;
          padding:0 20px; height:52px; background:#fff;
          border-bottom:1px solid #e8e8e4; flex-shrink:0; }
.topbar-title { font-weight:500; font-size:15px; }
.user-badge { display:flex; align-items:center; gap:8px; font-size:13px; color:#666; }
.role-tag { font-size:11px; padding:2px 8px; border-radius:20px; font-weight:500; }
.role-all{background:#f1f0f8;color:#5b5b8a} .role-hr{background:#eff6ff;color:#1d4ed8}
.role-dev{background:#f0fdf4;color:#15803d} .role-admin{background:#fff7ed;color:#c2410c}
.role-manager{background:#fdf4ff;color:#7e22ce}
.topbar-actions { display:flex; gap:8px; }
.btn-icon { display:flex; align-items:center; justify-content:center; width:32px; height:32px;
            border:1px solid #e8e8e4; border-radius:7px; background:#fff; cursor:pointer;
            color:#666; font-size:15px; transition:all .15s; }
.btn-icon:hover { background:#f5f5f0; }

.body { display:flex; flex:1; overflow:hidden; }

/* 工具面板（左侧） */
.tool-panel { width:200px; border-right:1px solid #e8e8e4; background:#fafaf8;
              display:flex; flex-direction:column; flex-shrink:0; }
.tool-panel.collapsed { width:0; overflow:hidden; }
.panel-header { padding:12px 14px 8px; font-size:11px; color:#999; font-weight:500;
                letter-spacing:.5px; border-bottom:1px solid #f0f0ec; }
.tool-list { padding:8px; flex:1; overflow-y:auto; }
.tool-item { padding:8px 10px; border-radius:7px; margin-bottom:4px; font-size:12px; }
.tool-item-icon { font-size:15px; margin-bottom:2px; }
.tool-item-name { font-weight:500; color:#333; }
.tool-item-desc { color:#999; font-size:11px; margin-top:1px; line-height:1.4; }
.tool-item.active { background:#eff6ff; border:1px solid #bfdbfe; }
.tool-item.done   { background:#f0fdf4; border:1px solid #bbf7d0; }

/* 对话区 */
.chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.messages { flex:1; overflow-y:auto; padding:20px 0; display:flex; flex-direction:column; }
.messages::-webkit-scrollbar { width:4px; }
.messages::-webkit-scrollbar-thumb { background:#ddd; border-radius:2px; }

/* 欢迎屏 */
.welcome { flex:1; display:flex; flex-direction:column; align-items:center;
           justify-content:center; color:#999; padding:40px; }
.welcome-icon { font-size:44px; margin-bottom:14px; }
.welcome h2 { font-size:18px; font-weight:500; color:#555; margin-bottom:6px; }
.welcome p  { font-size:13px; text-align:center; line-height:1.7; }
.welcome-suggestions { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; justify-content:center; }
.suggestion { padding:7px 14px; border:1px solid #e0e0dc; border-radius:20px;
              font-size:13px; cursor:pointer; background:#fff; color:#555;
              transition:all .15s; }
.suggestion:hover { border-color:#1d4ed8; color:#1d4ed8; background:#eff6ff; }

/* 消息 */
.msg-row { display:flex; padding:5px 20px; gap:10px; }
.msg-row.user { flex-direction:row-reverse; }
.msg-avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0;
              display:flex; align-items:center; justify-content:center; font-size:13px; }
.avatar-bot  { background:#eff6ff; color:#1d4ed8; }
.avatar-user { background:#1d4ed8; color:#fff; font-weight:500; }
.msg-body { max-width:70%; display:flex; flex-direction:column; gap:3px; }
.msg-row.user .msg-body { align-items:flex-end; }
.bubble { padding:10px 13px; border-radius:12px; line-height:1.7;
          font-size:14px; word-break:break-word; white-space:pre-wrap; }
.bubble-bot  { background:#fff; border:1px solid #e8e8e4; border-radius:12px 12px 12px 3px; }
.bubble-user { background:#1d4ed8; color:#fff; border-radius:12px 12px 3px 12px; }
.msg-time { font-size:11px; color:#ccc; padding:0 3px; }

/* 工具调用展示 */
.tool-call { margin:4px 0; border-radius:8px; overflow:hidden; font-size:12px; }
.tool-call-header { display:flex; align-items:center; gap:6px; padding:6px 10px;
                    cursor:pointer; user-select:none; }
.tc-running { background:#fffbeb; border:1px solid #fde68a; }
.tc-done    { background:#f0fdf4; border:1px solid #bbf7d0; }
.tc-icon { font-size:13px; }
.tc-name { font-weight:500; }
.tc-args { color:#888; font-size:11px; margin-left:auto; max-width:160px;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tc-body { padding:8px 10px; background:#fafaf8; border-top:1px solid #f0f0ec;
           font-size:12px; color:#555; white-space:pre-wrap; max-height:120px;
           overflow-y:auto; line-height:1.6; display:none; }
.tc-body.open { display:block; }
.tc-spinner { width:10px; height:10px; border:1.5px solid #d97706;
              border-top-color:transparent; border-radius:50%;
              animation:spin .7s linear infinite; flex-shrink:0; }
@keyframes spin { to{transform:rotate(360deg)} }

.cursor { display:inline-block; width:2px; height:14px; background:#1d4ed8;
          margin-left:1px; animation:blink .7s infinite; vertical-align:text-bottom; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* 引用来源 */
.sources { margin-top:8px; display:flex; flex-direction:column; gap:3px; }
.source-item { display:flex; align-items:center; gap:6px; font-size:11px; color:#888;
               padding:3px 8px; background:#f7f7f4; border-radius:5px; }
.source-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.src-kb   { background:#1d4ed8; }
.src-web  { background:#16a34a; }
.src-db   { background:#d97706; }

/* 输入区 */
.input-area { padding:10px 16px 14px; border-top:1px solid #e8e8e4;
              background:#fff; flex-shrink:0; }
.input-row { display:flex; gap:8px; align-items:flex-end;
             background:#f7f7f5; border:1px solid #e0e0dc; border-radius:12px;
             padding:7px 8px 7px 13px; transition:border .15s; }
.input-row:focus-within { border-color:#1d4ed8; background:#fff; }
.input-box { flex:1; border:none; outline:none; background:transparent;
             font-size:14px; resize:none; line-height:1.6; max-height:100px;
             font-family:inherit; }
.btn-send { width:32px; height:32px; background:#1d4ed8; border:none; border-radius:8px;
            color:#fff; cursor:pointer; display:flex; align-items:center;
            justify-content:center; flex-shrink:0; transition:background .15s; }
.btn-send:hover:not(:disabled) { background:#1e40af; }
.btn-send:disabled { background:#93c5fd; cursor:not-allowed; }
.input-hint { font-size:11px; color:#ccc; margin-top:5px; text-align:center; }

.typing-indicator { display:flex; gap:4px; padding:10px 13px; }
.typing-dot { width:7px; height:7px; border-radius:50%; background:#c8c8c8;
              animation:bounce .8s infinite; }
.typing-dot:nth-child(2){animation-delay:.15s} .typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce {0%,80%,100%{transform:none} 40%{transform:translateY(-6px)}}

.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
         background:#333; color:#fff; padding:7px 16px; border-radius:20px;
         font-size:12px; z-index:999; pointer-events:none; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">✨</div>
      <h1>星辰科技智能助手</h1>
      <p>知识库 · 网页搜索 · 数据查询</p>
    </div>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input class="form-input" id="u" placeholder="输入用户名" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input" type="password" id="p" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()" id="btn-login">登 录</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">测试账号：alice(HR) · bob(研发) · charlie(管理员) · david(普通员工)<br>密码均为 test123</div>
  </div>
</div>

<!-- 主界面 -->
<div id="chat-page">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="btn-icon" onclick="togglePanel()" title="工具面板">⚙</div>
      <span class="topbar-title">✨ 星辰智能助手</span>
    </div>
    <div class="user-badge">
      <span id="user-name">—</span>
      <span class="role-tag" id="user-role-tag">—</span>
    </div>
    <div class="topbar-actions">
      <div class="btn-icon" onclick="clearHistory()" title="清空对话">🗑</div>
      <div class="btn-icon" onclick="logout()" title="退出">↩</div>
    </div>
  </div>

  <div class="body">
    <!-- 工具面板 -->
    <div class="tool-panel" id="tool-panel">
      <div class="panel-header">可用工具</div>
      <div class="tool-list" id="tool-list">
        <div style="padding:12px;font-size:12px;color:#ccc">加载中…</div>
      </div>
    </div>

    <!-- 对话区 -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome-screen">
          <div class="welcome-icon">✨</div>
          <h2>有什么可以帮你？</h2>
          <p>我可以查询公司制度、搜索网页资讯、查询员工数据</p>
          <div class="welcome-suggestions" id="suggestions"></div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <textarea class="input-box" id="input-box" rows="1"
            placeholder="输入问题… Enter 发送，Shift+Enter 换行"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="btn-send" id="btn-send" onclick="sendMsg()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M14 2L2 7l5 1.5L9 14l5-12z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">回答基于知识库、网页搜索和数据库综合生成</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 状态 ──────────────────────────────────────────────────────────────────────
let token = localStorage.getItem('kb_token')
let me    = JSON.parse(localStorage.getItem('kb_me') || 'null')
let isStreaming = false

const TOOL_META = {
  kb_search:    { icon: '📚', label: '知识库检索',  color: 'src-kb'  },
  web_search:   { icon: '🌐', label: '网页搜索',    color: 'src-web' },
  db_query:     { icon: '🗄️', label: '数据库查询',  color: 'src-db'  },
  calculator:   { icon: '🧮', label: '计算器',      color: 'src-kb'  },
  get_datetime: { icon: '📅', label: '日期时间',    color: 'src-kb'  },
}

const SUGGESTIONS = {
  all:     ['年假还剩多少天？', '报销发票抬头怎么填？', '迟到会有什么处罚？', '今天是几号？'],
  hr:      ['研发部有多少人？', 'P5 薪资范围是多少？', '绩效 S 级奖金系数？', '查一下张三的职级'],
  dev:     ['PR 需要几个 reviewer？', '生产发布流程是什么？', '最新的 Python 异步最佳实践', '本月还有几个工作日？'],
  admin:   ['各部门人数统计', '最近有什么 AI 政策更新？', 'P5 薪资范围？', '在职员工有多少人？'],
  manager: ['研发部人数？', '最近有什么行业动态？', '各部门负责人是谁？'],
}

// ── 初始化 ────────────────────────────────────────────────────────────────────
if (token && me) showChat()
else showLogin()

function showLogin() {
  document.getElementById('login-page').style.display = 'flex'
  document.getElementById('chat-page').style.display  = 'none'
}
function showChat() {
  document.getElementById('login-page').style.display = 'none'
  document.getElementById('chat-page').style.display  = 'flex'
  initChat()
}
function initChat() {
  document.getElementById('user-name').textContent = me.name
  const rt = document.getElementById('user-role-tag')
  rt.textContent = me.role; rt.className = `role-tag role-${me.role}`

  const suggs = SUGGESTIONS[me.role] || SUGGESTIONS.all
  document.getElementById('suggestions').innerHTML =
    suggs.map(s => `<div class="suggestion" onclick="ask('${s.replace(/'/g,"\\'")}')">${s}</div>`).join('')

  loadTools()
}

// ── 登录 ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('u').value.trim()
  const password = document.getElementById('p').value
  const errEl    = document.getElementById('login-error')
  const btn      = document.getElementById('btn-login')
  if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return }
  btn.textContent = '登录中…'; btn.disabled = true; errEl.textContent = ''
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    })
    const d = await r.json()
    if (!r.ok) throw new Error(d.detail)
    token = d.token; me = d.user
    localStorage.setItem('kb_token', token)
    localStorage.setItem('kb_me', JSON.stringify(me))
    showChat()
  } catch(e) { errEl.textContent = e.message }
  finally { btn.textContent = '登 录'; btn.disabled = false }
}

function logout() {
  token = null; me = null
  localStorage.removeItem('kb_token'); localStorage.removeItem('kb_me')
  showLogin()
}

// ── 工具面板 ──────────────────────────────────────────────────────────────────
async function loadTools() {
  try {
    const tools = await fetch('/api/tools', { headers: auth() }).then(r => r.json())
    const list  = document.getElementById('tool-list')
    list.innerHTML = tools.map(t => {
      const m = TOOL_META[t.name] || { icon:'🔧', label: t.name }
      return `
        <div class="tool-item" id="tp-${t.name}">
          <div class="tool-item-icon">${m.icon}</div>
          <div class="tool-item-name">${m.label}</div>
          <div class="tool-item-desc">${t.description}</div>
        </div>`
    }).join('')
  } catch(e) {}
}

function togglePanel() {
  document.getElementById('tool-panel').classList.toggle('collapsed')
}

function highlightTool(name, state) {
  const el = document.getElementById(`tp-${name}`)
  if (!el) return
  el.className = `tool-item ${state === 'active' ? 'active' : state === 'done' ? 'done' : ''}`
}

// ── 发消息 ────────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg() }
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px' }
function ask(q) { document.getElementById('input-box').value = q; sendMsg() }

async function sendMsg() {
  if (isStreaming) return
  const box = document.getElementById('input-box')
  const msg = box.value.trim()
  if (!msg) return

  const welcome = document.getElementById('welcome-screen')
  if (welcome) welcome.remove()

  box.value = ''; box.style.height = 'auto'
  isStreaming = true
  document.getElementById('btn-send').disabled = true

  appendMsg('user', msg)
  const botId = 'bot-' + Date.now()
  appendBotLoading(botId)

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    })
    if (!resp.ok) throw new Error((await resp.json()).detail)

    const reader  = resp.body.getReader()
    const decoder = new TextDecoder()
    let   buf = '', answer = '', firstToken = true
    // 当前正在展示的工具调用元素 id
    let   currentToolEl = null

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n')
      buf = lines.pop()

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        let evt
        try { evt = JSON.parse(line.slice(6)) } catch { continue }

        if (evt.type === 'tool_start') {
          // 工具开始：在气泡内插入工具调用卡片
          if (firstToken) { clearBotLoading(botId); firstToken = false }
          const m = TOOL_META[evt.tool] || { icon:'🔧', label: evt.tool }
          const argsPreview = JSON.stringify(evt.args).slice(0, 60)
          const tcId = `tc-${Date.now()}`
          currentToolEl = tcId
          const bubble = document.getElementById(`${botId}-bubble`)
          const tc = document.createElement('div')
          tc.className = 'tool-call tc-running'; tc.id = tcId
          tc.innerHTML = `
            <div class="tool-call-header" onclick="toggleTcBody('${tcId}-body')">
              <div class="tc-spinner"></div>
              <span class="tc-icon">${m.icon}</span>
              <span class="tc-name">${m.label}</span>
              <span class="tc-args">${escHtml(argsPreview)}</span>
            </div>
            <div class="tc-body" id="${tcId}-body"></div>`
          bubble.appendChild(tc)
          highlightTool(evt.tool, 'active')
          scrollBot()

        } else if (evt.type === 'tool_end') {
          // 工具结束：更新卡片状态
          const tc = document.getElementById(currentToolEl)
          if (tc) {
            tc.className = 'tool-call tc-done'
            const spinner = tc.querySelector('.tc-spinner')
            if (spinner) spinner.outerHTML = '<span style="color:#16a34a">✓</span>'
            const body = tc.querySelector('.tc-body')
            if (body) body.textContent = evt.result
          }
          highlightTool(evt.tool, 'done')
          scrollBot()

        } else if (evt.type === 'token') {
          // 文字片段
          if (firstToken) { clearBotLoading(botId); firstToken = false }
          answer += evt.content
          const bubble = document.getElementById(`${botId}-bubble`)
          // 找或建 answer-text 容器
          let at = bubble.querySelector('.answer-text')
          if (!at) {
            at = document.createElement('div')
            at.className = 'answer-text'
            bubble.appendChild(at)
          }
          at.innerHTML = escHtml(answer) + '<span class="cursor"></span>'
          scrollBot()

        } else if (evt.type === 'sources') {
          // 来源
          const bubble = document.getElementById(`${botId}-bubble`)
          const at = bubble.querySelector('.answer-text')
          if (at) at.innerHTML = escHtml(answer)  // 去掉光标
          if (evt.content?.length) {
            const seen = new Set()
            const uniq = evt.content.filter(s => !seen.has(s.source) && seen.add(s.source))
            const div = document.createElement('div')
            div.className = 'sources'
            div.innerHTML = uniq.map(s => {
              const m = TOOL_META[s.tool] || {}
              return `<div class="source-item">
                <span class="source-dot ${m.color||'src-kb'}"></span>
                <span>${escHtml(s.source)}</span>
              </div>`
            }).join('')
            bubble.appendChild(div)
          }
          scrollBot()

        } else if (evt.type === 'error') {
          clearBotLoading(botId)
          const bubble = document.getElementById(`${botId}-bubble`)
          bubble.textContent = '⚠️ ' + evt.content
        }
      }
    }
  } catch(e) {
    clearBotLoading(botId)
    const bubble = document.getElementById(`${botId}-bubble`)
    if (bubble) bubble.textContent = '⚠️ 网络异常，请重试'
  } finally {
    isStreaming = false
    document.getElementById('btn-send').disabled = false
    document.getElementById('input-box').focus()
    // 重置工具面板高亮
    document.querySelectorAll('.tool-item').forEach(el =>
      el.className = el.className.replace(' active','').replace(' done',''))
  }
}

// ── DOM ───────────────────────────────────────────────────────────────────────
function appendMsg(role, content) {
  const isUser = role === 'user'
  const ms  = document.getElementById('messages')
  const row = document.createElement('div')
  row.className = `msg-row ${isUser ? 'user' : ''}`
  row.innerHTML = `
    <div class="msg-avatar ${isUser?'avatar-user':'avatar-bot'}">${isUser?(me?.name?.[0]||'U'):'✨'}</div>
    <div class="msg-body">
      <div class="bubble ${isUser?'bubble-user':'bubble-bot'}">${escHtml(content)}</div>
      <div class="msg-time">${nowTime()}</div>
    </div>`
  ms.appendChild(row); scrollBot()
}

function appendBotLoading(id) {
  const ms  = document.getElementById('messages')
  const row = document.createElement('div')
  row.className = 'msg-row'; row.id = id
  row.innerHTML = `
    <div class="msg-avatar avatar-bot">✨</div>
    <div class="msg-body">
      <div class="bubble bubble-bot" id="${id}-bubble">
        <div class="typing-indicator">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
      </div>
    </div>`
  ms.appendChild(row); scrollBot()
}

function clearBotLoading(id) {
  const bubble = document.getElementById(`${id}-bubble`)
  if (bubble) {
    const ti = bubble.querySelector('.typing-indicator')
    if (ti) ti.remove()
  }
}

function toggleTcBody(id) {
  const el = document.getElementById(id)
  if (el) el.classList.toggle('open')
}

function scrollBot() {
  const ms = document.getElementById('messages')
  ms.scrollTop = ms.scrollHeight
}

async function clearHistory() {
  if (!confirm('确认清空对话历史？')) return
  await fetch('/api/history', { method: 'DELETE', headers: auth() })
  const ms = document.getElementById('messages')
  ms.innerHTML = ''
  const w = document.createElement('div')
  w.id = 'welcome-screen'; w.className = 'welcome'
  const suggs = SUGGESTIONS[me?.role] || SUGGESTIONS.all
  w.innerHTML = `<div class="welcome-icon">✨</div><h2>有什么可以帮你？</h2>
    <p>我可以查询公司制度、搜索网页资讯、查询员工数据</p>
    <div class="welcome-suggestions">${suggs.map(s=>`<div class="suggestion" onclick="ask('${s.replace(/'/g,"\\'")}')">  ${s}</div>`).join('')}</div>`
  ms.appendChild(w)
  showToast('历史已清空')
}

// ── 工具 ──────────────────────────────────────────────────────────────────────
function auth() { return { 'Authorization': `Bearer ${token}` } }
function nowTime() { return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) }
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')
}
function showToast(msg) {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2000)
}
</script>
</body>
</html>
